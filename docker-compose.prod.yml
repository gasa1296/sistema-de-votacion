services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    env_file: .env.production
    networks:
      - voting

  nginx:
    image: nginx:alpine
    container_name: voting-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - voting

  mysql:
    image: mysql:8.4
    container_name: voting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-voting}
      MYSQL_USER: ${DB_USERNAME:-voting}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voting

  redis:
    image: redis:alpine
    container_name: voting-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voting

volumes:
  storage:
  mysql_data:
  redis_data:

networks:
  voting:
