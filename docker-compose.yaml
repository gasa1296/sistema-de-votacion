services:
    app:
        build: .
        container_name: "votaciones"
        ports:
            - "8000:8000"
            - "5173:5173"
        volumes:
            - ".:/app"
            - "/app/vendor"
            - "/app/node_modules"
        networks:
            - "votaciones"

networks:
    votaciones:
        driver: bridge
